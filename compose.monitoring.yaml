# Same-host integration with kmpoltorak-monitoring-tools. Start monitoring first.
services:
  app:
    ports: !override ["127.0.0.1:${MONITORED_HTTP_PORT:-18082}:8080"]
    networks:
      default:
      monitoring:
        aliases: [ai-network-incident-investigator]
  postgres:
    ports: !reset []
  prometheus:
    profiles: !override [local-monitoring]
  grafana:
    profiles: !override [local-monitoring]

networks:
  monitoring:
    external: true
    name: kmpoltorak-monitoring-incident-investigator
