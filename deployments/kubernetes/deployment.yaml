apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-investigator
  labels:
    app.kubernetes.io/name: incident-investigator
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: incident-investigator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: incident-investigator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      # Investigations are synchronous; allow in-flight ones to finish.
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
        # Allows unprivileged ICMP sockets for the ping diagnostic
        # (a namespaced "safe" sysctl, no capabilities required).
        sysctls:
          - name: net.ipv4.ping_group_range
            value: "0 2147483647"
      containers:
        - name: api
          image: ghcr.io/kmpoltorak/ai-network-incident-investigator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: incident-investigator
            - secretRef:
                name: incident-investigator
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
