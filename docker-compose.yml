# Default:            docker compose up --build            (app + postgres)
# With a local LLM:   LLM_PROVIDER=ollama docker compose --profile ollama up --build
# With monitoring:    docker compose --profile monitoring up --build   (Prometheus :9090, Grafana :3000)
#
# Values come from .env (see .env.example). Addresses of other containers
# (database, Ollama) are fixed here because they are facts of this network.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: investigator
      POSTGRES_PASSWORD: investigator
      POSTGRES_DB: investigator
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investigator -d investigator"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    image: ai-network-incident-investigator:local
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-8080}:8080"
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://investigator:investigator@postgres:5432/investigator?sslmode=disable
      LLM_PROVIDER: ${LLM_PROVIDER:-rules}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-120s}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OLLAMA_BASE_URL: http://ollama:11434
      SIMULATION_ENABLED: ${SIMULATION_ENABLED:-true}
      SIMULATION_SCENARIO: ${SIMULATION_SCENARIO:-healthy}
      INVESTIGATION_TIMEOUT: ${INVESTIGATION_TIMEOUT:-180s}
      MAX_CONCURRENT_INVESTIGATIONS: ${MAX_CONCURRENT_INVESTIGATIONS:-4}
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  ollama:
    profiles: [ollama]
    image: ollama/ollama:0.12.3
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot job that downloads the model into the shared volume.
  ollama-pull:
    profiles: [ollama]
    image: ollama/ollama:0.12.3
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["ollama", "pull", "${LLM_MODEL:-llama3.2}"]
    restart: "no"

  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.6.0
    ports:
      - "9090:9090"
    volumes:
      - ./deployments/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  # Local demo only: anonymous read-only access, admin password from env.
  grafana:
    profiles: [monitoring]
    image: grafana/grafana:12.2.0
    depends_on: [prometheus]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/incident-investigator.json
    volumes:
      - ./deployments/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deployments/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  pgdata:
  ollama:
